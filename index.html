<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    body {
        background: #111111;
        color: white;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-size: clamp(42px, 7vw, 110px);
        font-weight: 700;
        letter-spacing: -3px;
        margin: 0;
    }

    p {
        margin-top: 18px;
        font-size: 18px;
        color: #999999;
        letter-spacing: 1px;
    }

    .hero {
        width: 100%;
        max-width: 1400px;
        text-align: center;
    }
    .reveal-layer {
    position: fixed;
    inset: 0;
    background: #ffffff;
    color: #111111;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 10;
      clip-path: circle(120px at 50% 50%);
transition: clip-path 0.1s ease;
}
  </style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manikandan Visuals</title>
</head>

<body>

    <div class="hero">
        <h1>MANIKANDAN VISUALS</h1>
        <p>Graphic Designer & Video Editor</p>
    </div>

    <div class="reveal-layer">
        <div class="reveal-content">
            SELECTED WORKS
        </div>
    </div>

  <script>
const revealLayer = document.querySelector('.reveal-layer');

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let currentX = mouseX;
let currentY = mouseY;

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animateReveal() {
    currentX += (mouseX - currentX) * 0.12;
    currentY += (mouseY - currentY) * 0.12;

    revealLayer.style.clipPath =
        `circle(120px at ${currentX}px ${currentY}px)`;

    requestAnimationFrame(animateReveal);
}

animateReveal();
</script>
</body>

</html>
